<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="2678" viewBox="0 0 400 2678" role="img" aria-labelledby="title desc" xml:lang="es">
  <title id="title">Crimson WM, fase F8: flujo implementado</title>
  <desc id="desc">Diagrama técnico basado en el código fuente; no es una captura
    ni una prueba de ejecución. El display :0 se rechaza siempre, lo que protege
    la sesión principal solo mientras esta use :0. En un entorno de prueba con
    Xvfb, preparado por el arnés, el proceso crimson-wm comprueba en orden los
    argumentos, DISPLAY, el token, la conexión por socket Unix con cookie, la
    marca de sandbox, la ausencia de otro gestor y SubstructureRedirect; después
    captura los atajos de teclado, adopta las ventanas ya visibles y atiende
    los eventos: las ventanas normales se colocan en mosaico master-stack, las
    demás quedan flotantes, el foco se mueve con el teclado y los atajos de
    lanzamiento abren programas desde un hilo, sin shell, con un entorno sin
    el token del sandbox. Hay ocho escritorios virtuales: las ventanas de los
    inactivos se desmapean, los desmapeos propios se reconocen por su número
    de secuencia y el save-set hace que el servidor vuelva a mapearlas si el
    WM termina. Desde F6 el WM se identifica (ventana de comprobación,
    selección WM_S0 y _NET_SUPPORTED) solo después de las salvaguardas,
    cierra ventanas con WM_DELETE_WINDOW o, a petición del usuario, con
    KillClient, y atiende peticiones EWMH validadas. Desde F7 una ventana por
    escritorio puede estar a pantalla completa (Mod4+f o _NET_WM_STATE) y
    recupera su geometría al salir. Desde F8 los diálogos (WM_TRANSIENT_FOR)
    nacen en el escritorio de su principal, quedan encima de ella, se mueven
    con ella y le devuelven el foco al cerrarse. Cada paso indica sus códigos de salida. Aparte se muestra una selección de funciones pendientes.
    Las salvaguardas reducen accidentes, pero no son una frontera de
    seguridad.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", "Liberation Sans", Arial, Helvetica, sans-serif; font-size: 14px; fill: #1F2328; }
      .h { font-size: 16px; font-weight: 700; }
      .b { font-weight: 700; }
      .muted { fill: #57606A; }
      .accent { fill: #B3132B; }
      .code { font-weight: 700; fill: #B3132B; text-anchor: end; }
      .box { fill: #FFFFFF; stroke: #1F2328; stroke-width: 1.5; }
      .proc { fill: #F6F8FA; stroke: #1F2328; stroke-width: 1.5; }
      .reject { fill: #FFFFFF; stroke: #B3132B; stroke-width: 2; }
      .boundary { fill: none; stroke: #B3132B; stroke-width: 2; stroke-dasharray: 8 5; }
      .pending { fill: #FFFFFF; stroke: #8C959F; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .sep { stroke: #D0D7DE; stroke-width: 1; }
      .flow { stroke: #1F2328; stroke-width: 1.5; }
    </style>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1F2328"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0L0 5L10 10z" fill="#1F2328"/>
    </marker>
  </defs>

  <rect width="400" height="2678" fill="#FFFFFF"/>

  <text class="h" x="20" y="30">Crimson WM · fase F8</text>
  <text class="muted" x="20" y="52">Diagrama técnico del código actual;</text>
  <text class="muted" x="20" y="72">no es una captura ni prueba de ejecución.</text>

  <!-- Display :0: fuera del entorno de prueba -->
  <g>
    <rect class="reject" x="8" y="88" width="384" height="100" rx="6"/>
    <text class="h accent" x="20" y="112">Display :0 (sesión principal)</text>
    <text x="20" y="134">Se rechaza siempre en la capa 1, antes</text>
    <text x="20" y="154">de conectar (código 10). Solo protege la</text>
    <text x="20" y="174">sesión mientras esta siga usando :0.</text>
  </g>

  <!-- Entorno de prueba -->
  <g>
    <rect class="boundary" x="8" y="204" width="384" height="2166" rx="8"/>
    <text class="h accent" x="20" y="228">Entorno de prueba (Xvfb)</text>
  </g>

  <g>
    <rect class="box" x="20" y="242" width="360" height="40" rx="4"/>
    <text class="h" x="32" y="268">Clientes X11 (p. ej. xmessage)</text>
  </g>

  <line class="flow" x1="52" y1="282" x2="52" y2="314" marker-end="url(#arrow-end)"/>
  <text class="muted" x="68" y="303">piden mapear y configurar ventanas</text>

  <g>
    <rect class="box" x="20" y="316" width="360" height="100" rx="4"/>
    <text class="h" x="32" y="340">Servidor Xvfb :N (N ≠ 0)</text>
    <text x="32" y="362">El arnés lo lanza con xvfb-run (cookie</text>
    <text x="32" y="382">temporal, -nolisten tcp, sin -ac) y</text>
    <text x="32" y="402">pone la marca _CRIMSON_SANDBOX.</text>
  </g>

  <line class="flow" x1="52" y1="420" x2="52" y2="472" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text class="muted" x="68" y="441">conexión: socket Unix y cookie (paso 4)</text>
  <text class="muted" x="68" y="461">eventos: peticiones redirigidas y atajo</text>

  <!-- Proceso crimson-wm -->
  <g>
    <rect class="proc" x="20" y="476" width="360" height="1666" rx="4"/>
    <text class="h" x="32" y="500">Proceso crimson-wm</text>

    <text class="h" x="32" y="528">1 · Argumentos</text>
    <text class="code" x="368" y="528">0 · 2</text>
    <text class="muted" x="32" y="550">--help o --version: 0</text>
    <text class="muted" x="32" y="570">Desconocido o más de uno: 2</text>
    <line class="sep" x1="32" y1="584" x2="368" y2="584"/>

    <text class="h" x="32" y="608">2 · Capa 1: DISPLAY</text>
    <text class="code" x="368" y="608">10 · 11</text>
    <text class="muted" x="32" y="630">Se lee una sola vez. Ausente o vacío: 11</text>
    <text class="muted" x="32" y="650">Admite displays locales con número ≠ 0.</text>
    <text class="muted" x="32" y="670">Rechaza :0, TCP, hosts, rutas y valores</text>
    <text class="muted" x="32" y="690">malformados o no Unicode: 10</text>
    <line class="sep" x1="32" y1="704" x2="368" y2="704"/>

    <text class="h" x="32" y="728">3 · Capa 2: token</text>
    <text class="code" x="368" y="728">10</text>
    <text class="muted" x="32" y="750">CRIMSON_SANDBOX_TOKEN ausente,</text>
    <text class="muted" x="32" y="770">vacío o no Unicode: 10</text>
    <line class="sep" x1="32" y1="784" x2="368" y2="784"/>

    <text class="h" x="32" y="808">4 · Conexión con cookie</text>
    <text class="code" x="368" y="808">11 · 14</text>
    <text class="muted" x="32" y="830">Solo socket Unix local, sin TCP.</text>
    <text class="muted" x="32" y="850">Presenta la cookie MIT-MAGIC-COOKIE-1;</text>
    <text class="muted" x="32" y="870">el servidor X decide si la acepta.</text>
    <text class="muted" x="32" y="890">No autentica al servidor ni cifra.</text>
    <text class="muted" x="32" y="910">Sin socket, sin cookie o rechazo: 11</text>
    <text class="muted" x="32" y="930">Pantalla inexistente: 14</text>
    <line class="sep" x1="32" y1="944" x2="368" y2="944"/>

    <text class="h" x="32" y="968">5 · Capa 2: marca de sandbox</text>
    <text class="code" x="368" y="968">10</text>
    <text class="muted" x="32" y="990">_CRIMSON_SANDBOX ausente o distinta</text>
    <text class="muted" x="32" y="1010">del token: 10</text>
    <line class="sep" x1="32" y1="1024" x2="368" y2="1024"/>

    <text class="h" x="32" y="1048">6 · Capa 3: otro gestor</text>
    <text class="code" x="368" y="1048">12</text>
    <text class="muted" x="32" y="1070">Propiedad _NET_SUPPORTING_WM_CHECK</text>
    <text class="muted" x="32" y="1090">en la raíz, aunque sea obsoleta, o</text>
    <text class="muted" x="32" y="1110">WM_S0 con propietario: 12</text>
    <line class="sep" x1="32" y1="1124" x2="368" y2="1124"/>

    <text class="h" x="32" y="1148">7 · Capa 4: redirección</text>
    <text class="code" x="368" y="1148">12</text>
    <text class="muted" x="32" y="1170">Pide SubstructureRedirect en la raíz.</text>
    <text class="muted" x="32" y="1190">BadAccess (otro cliente ya la tiene): 12</text>
    <line class="sep" x1="32" y1="1204" x2="368" y2="1204"/>

    <text class="h" x="32" y="1228">8 · Atajos de teclado</text>
    <text class="code" x="368" y="1228">14</text>
    <text class="muted" x="32" y="1250">Captura en la raíz Mod4+j, Mod4+k,</text>
    <text class="muted" x="32" y="1270">Mod4+Shift+Return, Mod4+Shift+Escape,</text>
    <text class="muted" x="32" y="1290">Mod4+w, Mod4+Shift+w y Mod4+f.</text>
    <text class="muted" x="32" y="1310">Sin tecla o captura rechazada: 14</text>
    <text class="muted" x="32" y="1330">Lanzamiento (Mod4+Return, d, e, b, n</text>
    <text class="muted" x="32" y="1350">y Print): opcionales; avisa y sigue.</text>
    <text class="muted" x="32" y="1370">Escritorios (Mod4+1…8, Mod4+Shift+1…8</text>
    <text class="muted" x="32" y="1390">y Mod4+Tab): obligatorios; fallo: 14.</text>
    <line class="sep" x1="32" y1="1404" x2="368" y2="1404"/>

    <text class="h" x="32" y="1428">9 · Identificación EWMH</text>
    <text class="code" x="368" y="1428">12 · 14</text>
    <text class="muted" x="32" y="1450">Ventana de comprobación; con el servidor</text>
    <text class="muted" x="32" y="1470">capturado adquiere WM_S0 y publica</text>
    <text class="muted" x="32" y="1490">_NET_SUPPORTING_WM_CHECK y</text>
    <text class="muted" x="32" y="1510">_NET_SUPPORTED. Incoherencia: 12.</text>
    <line class="sep" x1="32" y1="1524" x2="368" y2="1524"/>

    <text class="h" x="32" y="1548">10 · Adopción y bucle de eventos</text>
    <text class="code" x="368" y="1548">0</text>
    <text class="muted" x="32" y="1570">Al arrancar adopta las ventanas visibles.</text>
    <text class="muted" x="32" y="1590">MapRequest: mosaico o flotante, y foco</text>
    <text class="muted" x="32" y="1610">ConfigureRequest: denegada en mosaico</text>
    <text class="muted" x="32" y="1630">Unmap/Destroy: reorganiza y reenfoca</text>
    <text class="muted" x="32" y="1650">Mod4+j/k: foco; Mod4+Shift+Return: maestra</text>
    <text class="muted" x="32" y="1670">Mod4+1…8: muestra ese escritorio y</text>
    <text class="muted" x="32" y="1690">oculta el anterior (UnmapWindow)</text>
    <text class="muted" x="32" y="1710">Mod4+Shift+1…8: mueve la enfocada</text>
    <text class="muted" x="32" y="1730">Mod4+Tab: vuelve al escritorio anterior</text>
    <text class="muted" x="32" y="1750">UnmapNotify del propio WM (ventana y</text>
    <text class="muted" x="32" y="1770">n.º de secuencia exactos): se ignora</text>
    <text class="muted" x="32" y="1790">FocusIn de un cliente: se sigue</text>
    <text class="muted" x="32" y="1810">Mod4+Shift+Escape: termina con 0</text>
    <text class="muted" x="32" y="1830">Mod4+w: WM_DELETE_WINDOW (cooperativo)</text>
    <text class="muted" x="32" y="1850">Mod4+Shift+w: KillClient (toda la conexión)</text>
    <text class="muted" x="32" y="1870">PropertyNotify: WM_HINTS y WM_PROTOCOLS</text>
    <text class="muted" x="32" y="1890">Peticiones EWMH validadas; listas de</text>
    <text class="muted" x="32" y="1910">clientes; SelectionClear: limpia y sale</text>
    <text class="muted" x="32" y="1930">Mod4+f, _NET_WM_STATE: pantalla completa</text>
    <text class="muted" x="32" y="1950">(una por escritorio; sube con el foco)</text>
    <text class="muted" x="32" y="1970">WM_TRANSIENT_FOR: diálogo encima de su</text>
    <text class="muted" x="32" y="1990">principal, con ella; foco al cerrarlo</text>
    <text class="muted" x="32" y="2010">Lanzamiento: un hilo lanza y espera</text>
    <text class="muted" x="32" y="2030">Error X: se registra y se ignora</text>
    <text class="muted" x="32" y="2050">Save-set: si el WM termina, el servidor</text>
    <text class="muted" x="32" y="2070">vuelve a mapear las ventanas ocultas.</text>
    <line class="sep" x1="32" y1="2084" x2="368" y2="2084"/>

    <text class="b" x="32" y="2108">Pasos 5 a 10: conexión perdida, 13.</text>
    <text class="b" x="32" y="2128">Pasos 5 a 9 y adopción: error X, 14.</text>
  </g>

  <line class="flow" x1="52" y1="2142" x2="52" y2="2174" marker-end="url(#arrow-end)"/>
  <text class="muted" x="68" y="2163">lanza (argv, sin shell)</text>

  <!-- Procesos hijos -->
  <g>
    <rect class="box" x="20" y="2176" width="360" height="180" rx="4"/>
    <text class="h" x="32" y="2200">Programas lanzados (hijos)</text>
    <text x="32" y="2222">Grupo de procesos propio; stdin vacío</text>
    <text x="32" y="2242">(/dev/null); stdout y stderr del WM.</text>
    <text x="32" y="2262">Sin CRIMSON_SANDBOX_TOKEN, WINDOWID</text>
    <text x="32" y="2282">ni DESKTOP_STARTUP_ID; DISPLAY = :N.S.</text>
    <text x="32" y="2302">Hasta 64 supervisados; un fallo no</text>
    <text x="32" y="2322">termina el WM. En las pruebas, solo</text>
    <text x="32" y="2342">programas falsos (PATH aislado).</text>
  </g>

  <!-- Pendiente -->
  <g>
    <rect class="pending" x="8" y="2386" width="384" height="204" rx="6"/>
    <text class="h muted" x="20" y="2410">Pendiente (selección)</text>
    <text class="muted" x="20" y="2432">No es la hoja de ruta completa; fases</text>
    <text class="muted" x="20" y="2452">y detalle en los ADR 0002 a 0010.</text>
    <text class="muted" x="20" y="2476">– Pruebas también con Xephyr</text>
    <text class="muted" x="20" y="2496">– Gestión limpia de señales</text>
    <text class="muted" x="20" y="2516">– Configuración (config.toml)</text>
    <text class="muted" x="20" y="2536">– Paneles: struts y _NET_WORKAREA</text>
    <text class="muted" x="20" y="2556">– Extensiones RandR y XKB</text>
    <text class="muted" x="20" y="2576">– Ventanas sticky (paneles)</text>
  </g>

  <text class="b accent" x="20" y="2618">Las salvaguardas reducen accidentes;</text>
  <text class="b accent" x="20" y="2638">no son una frontera de seguridad</text>
  <text class="b accent" x="20" y="2658">(ADR 0003).</text>
</svg>
