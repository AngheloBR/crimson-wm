<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1370" viewBox="0 0 1400 1370" role="img" aria-labelledby="title desc" xml:lang="es">
  <title id="title">Crimson WM, fase F8: diálogos y ventanas transitorias</title>
  <desc id="desc">Diagrama técnico basado en el código de F8 (ADR 0010); no es una
    captura. Muestra un árbol de ventanas con WM_TRANSIENT_FOR (una principal,
    sus diálogos y un subdiálogo), cómo se resuelve el propietario efectivo y
    qué relaciones son inválidas; el orden de apilamiento jerárquico; la
    asignación de escritorio y el movimiento en familia; la vuelta del foco
    al propietario; el centrado inicial; la familia de una ventana a
    pantalla completa, y lo aplazado.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", "Liberation Sans", Arial, Helvetica, sans-serif; font-size: 14px; fill: #1F2328; }
      .title { font-size: 26px; font-weight: 700; }
      .h { font-size: 17px; font-weight: 700; }
      .h2 { font-size: 15px; font-weight: 700; }
      .muted { fill: #57606A; }
      .accent { fill: #8B0A1F; }
      .small { font-size: 13px; }
      .label { font-size: 13px; fill: #57606A; }
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 13px; font-weight: 700; }
      .nlabel { font-size: 16px; font-weight: 700; }
      .light { fill: #FFFFFF; }
      .frame { fill: #FFFFFF; stroke: #1F2328; stroke-width: 1.5; }
      .guard { fill: #FFFFFF; stroke: #8B0A1F; stroke-width: 2; }
      .deferred { fill: #FFFFFF; stroke: #8C959F; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .n-red { fill: #8B0A1F; stroke: #1F2328; stroke-width: 1.2; }
      .n-dark { fill: #1F2328; stroke: #1F2328; stroke-width: 1.2; }
      .n-light { fill: #D0D7DE; stroke: #1F2328; stroke-width: 1.2; }
      .n-white { fill: #FFFFFF; stroke: #1F2328; stroke-width: 1.2; }
      .n-bad { fill: #FFFFFF; stroke: #8C959F; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .flow { stroke: #1F2328; stroke-width: 1.8; fill: none; }
      .flow-red { stroke: #8B0A1F; stroke-width: 2; fill: none; }
      .flow-bad { stroke: #8C959F; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1F2328"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8B0A1F"/>
    </marker>
  </defs>

  <rect width="1400" height="1370" fill="#FFFFFF"/>
  <text class="title" x="30" y="46">Crimson WM · F8: diálogos y ventanas transitorias (WM_TRANSIENT_FOR)</text>
  <text class="muted" x="30" y="74">Diagrama técnico del código de F8 (ADR 0010). No es una captura: la captura real está en crimson-wm-f8-comparison.png.</text>

  <!-- 1. Relaciones -->
  <rect class="frame" x="30" y="92" width="1340" height="360" rx="8"/>
  <text class="h" x="48" y="122">1 · Relaciones: propietario declarado y propietario efectivo</text>
  <rect class="n-red" x="170" y="150" width="200" height="64" rx="6"/>
  <text class="nlabel light" x="270" y="174" text-anchor="middle">A</text>
  <text class="small light" x="270" y="194" text-anchor="middle">principal (mosaico)</text>
  <rect class="n-light" x="60" y="290" width="180" height="64" rx="6"/>
  <text class="nlabel" x="150" y="314" text-anchor="middle">D1</text>
  <text class="small" x="150" y="334" text-anchor="middle">diálogo de A</text>
  <rect class="n-light" x="300" y="290" width="180" height="64" rx="6"/>
  <text class="nlabel" x="390" y="314" text-anchor="middle">D2</text>
  <text class="small" x="390" y="334" text-anchor="middle">diálogo de A</text>
  <rect class="n-white" x="60" y="380" width="180" height="56" rx="6"/>
  <text class="nlabel" x="150" y="404" text-anchor="middle">D3</text>
  <text class="small" x="150" y="424" text-anchor="middle">diálogo de D1</text>
  <line class="flow" x1="150" y1="290" x2="230" y2="218" marker-end="url(#arrow)"/>
  <line class="flow" x1="390" y1="290" x2="310" y2="218" marker-end="url(#arrow)"/>
  <line class="flow" x1="150" y1="380" x2="150" y2="358" marker-end="url(#arrow)"/>
  <text class="label" x="268" y="258" text-anchor="middle">WM_TRANSIENT_FOR</text>
  <text class="h2" x="520" y="160">Propietario efectivo (Workspaces::owner_of)</text>
  <text class="small" x="520" y="186">el declarado, si está gestionado en cualquier escritorio y la</text>
  <text class="small" x="520" y="207">cadena de propietarios no vuelve a la ventana ni pasa de 16</text>
  <text class="small" x="520" y="228">eslabones. Se resuelve cada vez que se usa: sin listas inversas.</text>
  <text class="small" x="520" y="249">Si el propietario se destruye o se retira, el diálogo queda</text>
  <text class="small" x="520" y="270">huérfano sin limpiar nada; no se cierra ni se mueve.</text>
  <text class="small" x="520" y="291">Si llega después, la relación empieza a valer sola (pendiente).</text>
  <text class="h2" x="520" y="330">Sin propietario efectivo</text>
  <rect class="n-bad" x="520" y="346" width="120" height="46" rx="6"/>
  <text class="nlabel" x="580" y="375" text-anchor="middle">0 · raíz</text>
  <rect class="n-bad" x="656" y="346" width="120" height="46" rx="6"/>
  <text class="nlabel" x="716" y="375" text-anchor="middle">sí misma</text>
  <rect class="n-bad" x="792" y="346" width="150" height="46" rx="6"/>
  <text class="nlabel" x="867" y="375" text-anchor="middle">no gestionada</text>
  <rect class="n-bad" x="958" y="346" width="80" height="46" rx="6"/>
  <text class="nlabel" x="998" y="375" text-anchor="middle">C1</text>
  <rect class="n-bad" x="1130" y="346" width="80" height="46" rx="6"/>
  <text class="nlabel" x="1170" y="375" text-anchor="middle">C2</text>
  <path class="flow-bad" d="M1040 362 H1126" marker-end="url(#arrow)"/>
  <path class="flow-bad" d="M1128 378 H1042" marker-end="url(#arrow)"/>
  <text class="label" x="1084" y="412" text-anchor="middle">ciclo: ninguna lo tiene</text>
  <text class="small muted" x="520" y="432">La raíz es «transitoria de grupo»: los grupos ICCCM no se implementan.</text>

  <!-- 2. Pila -->
  <rect class="frame" x="30" y="470" width="662" height="330" rx="8"/>
  <text class="h" x="48" y="500">2 · Pila jerárquica (de abajo arriba)</text>
  <rect class="n-white" x="60" y="520" width="120" height="46" rx="6"/>
  <text class="nlabel" x="120" y="549" text-anchor="middle">D3</text>
  <text class="small" x="200" y="549">cada diálogo, justo encima de su propietario</text>
  <rect class="n-light" x="60" y="580" width="120" height="46" rx="6"/>
  <text class="nlabel" x="120" y="609" text-anchor="middle">D1</text>
  <text class="small" x="200" y="609">familia más reciente (incluye D3)</text>
  <rect class="n-light" x="60" y="640" width="120" height="46" rx="6"/>
  <text class="nlabel" x="120" y="669" text-anchor="middle">D2</text>
  <text class="small" x="200" y="669">familia flotante más antigua</text>
  <rect class="n-red" x="60" y="700" width="120" height="46" rx="6"/>
  <text class="nlabel light" x="120" y="729" text-anchor="middle">A</text>
  <text class="small" x="200" y="729">mosaico: nunca se reordena</text>
  <text class="small muted" x="48" y="776">Workspaces::floating_stack: familias por su ventana más reciente; árbol dentro de cada familia.</text>

  <!-- 3. Escritorios y foco -->
  <rect class="frame" x="708" y="470" width="662" height="330" rx="8"/>
  <text class="h" x="726" y="500">3 · Escritorios, movimiento y foco</text>
  <text class="h2" x="726" y="530">Diálogo nuevo</text>
  <text class="small" x="890" y="530">al escritorio de su principal; si está oculto, se</text>
  <text class="small" x="890" y="555">queda oculto: sin cambiar de escritorio ni robar el foco.</text>
  <text class="h2" x="726" y="580">Mover</text>
  <text class="small" x="890" y="580">Mod4+Shift+n y _NET_WM_DESKTOP llevan la familia del</text>
  <text class="small" x="890" y="605">mismo escritorio, en su orden; un diálogo, sus subdiálogos.</text>
  <text class="h2" x="726" y="630">Cerrar</text>
  <text class="small" x="890" y="630">el foco vuelve al propietario si sigue en el mismo</text>
  <text class="small" x="890" y="655">escritorio y admite foco; si no, al historial.</text>
  <text class="h2" x="726" y="680">Cambio dinámico</text>
  <text class="small" x="890" y="680">PropertyNotify de WM_TRANSIENT_FOR: cambia la</text>
  <text class="small" x="890" y="705">relación y la pila; no reclasifica, no mueve, no enfoca.</text>
  <text class="h2" x="726" y="730">Centrado</text>
  <text class="small" x="890" y="730">solo al gestionarlo, sin USPosition/PPosition, sobre</text>
  <text class="small" x="890" y="755">la geometría real del propietario y dentro del área.</text>

  <!-- 4. Pantalla completa -->
  <rect class="guard" x="30" y="818" width="1340" height="250" rx="8"/>
  <text class="h accent" x="48" y="848">4 · Familia de una ventana a pantalla completa</text>
  <rect class="n-red" x="60" y="868" width="330" height="186"/>
  <text class="nlabel light" x="225" y="898" text-anchor="middle">A (pantalla completa)</text>
  <rect class="n-light" x="155" y="932" width="140" height="80" rx="6"/>
  <text class="nlabel" x="225" y="956" text-anchor="middle">D</text>
  <text class="small" x="225" y="976" text-anchor="middle">diálogo de A</text>
  <text class="small" x="420" y="896">El foco lo tiene A o uno de sus diálogos: A sube y sus diálogos quedan encima de ella, en su</text>
  <text class="small" x="420" y="918">orden de pila. Así un diálogo de un navegador o un reproductor a pantalla completa se ve</text>
  <text class="small" x="420" y="940">sobre su contenido. Al cerrarlo, el foco vuelve a A.</text>
  <text class="small" x="420" y="974">El foco pasa a una ventana ajena: A baja al fondo, como en F7, y la enfocada queda visible.</text>
  <text class="small muted" x="420" y="1008">Se mantienen las invariantes de F7: una por escritorio, estados ajenos de _NET_WM_STATE</text>
  <text class="small muted" x="420" y="1030">conservados, geometría restaurada y ningún cambio de escritorio inesperado.</text>

  <!-- 5. Aplazado -->
  <rect class="deferred" x="30" y="1086" width="1340" height="170" rx="8"/>
  <text class="h muted" x="48" y="1116">Aplazado: no implementado</text>
  <text class="small muted" x="48" y="1146">– _NET_WM_STATE_MODAL: sin bloqueo de interacción; se conserva en la propiedad, sin declararlo</text>
  <text class="small muted" x="48" y="1172">– grupos ICCCM (WM_HINTS.window_group, transitorias de grupo) · _NET_WM_STATE_DEMANDS_ATTENTION y urgencia</text>
  <text class="small muted" x="48" y="1198">– reclasificar en mosaico o flotante al cambiar WM_TRANSIENT_FOR · subir la ventana al enfocarla</text>
  <text class="small muted" x="48" y="1224">– reglas por aplicación (WM_CLASS) · decoraciones · paneles · varios monitores</text>

  <!-- Leyenda -->
  <line class="flow" x1="48" y1="1294" x2="108" y2="1294" marker-end="url(#arrow)"/>
  <text class="small" x="118" y="1299">WM_TRANSIENT_FOR efectivo</text>
  <path class="flow-bad" d="M330 1294 H390" marker-end="url(#arrow)"/>
  <text class="small muted" x="400" y="1299">relación sin efecto</text>
  <rect class="n-red" x="590" y="1284" width="50" height="20" rx="3"/>
  <text class="small" x="650" y="1299">principal</text>
  <rect class="n-light" x="760" y="1284" width="50" height="20" rx="3"/>
  <text class="small" x="820" y="1299">diálogo</text>
  <rect class="deferred" x="920" y="1284" width="60" height="20" rx="3"/>
  <text class="small muted" x="990" y="1299">aplazado</text>
  <text class="small muted" x="1370" y="1340" text-anchor="end">Fuente: src/workspaces.rs, src/wm.rs, src/icccm.rs, src/layout.rs</text>
  <text class="small" x="48" y="1340">Captura real del mismo comportamiento, en Xvfb: docs/images/crimson-wm-f8-comparison.png (A86).</text>
</svg>
