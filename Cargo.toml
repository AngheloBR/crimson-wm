[package]
name = "crimson-wm"
version = "0.1.0"
edition = "2024"
# MSRV declarado: 1.85 (1.85.0 o superior). Solo se verificará con rustc
# 1.85.1 de Debian 13; 1.85.0 no se probará (ver docs/adr/0001-toolchain.md).
rust-version = "1.85"
description = "An experimental, safety-first tiling window manager for X11, written in Rust (pre-alpha)"
repository = "https://github.com/AngheloBR/crimson-wm"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["x11", "window-manager", "tiling", "ewmh", "icccm"]
categories = ["gui"]
# Impide un `cargo publish` accidental.
publish = false
# authors: se omite (es opcional); la autoría consta en Git.

[dependencies]
# Solo el protocolo base de X11 en F1; las extensiones se activan cuando
# una fase las necesite (ver docs/adr/0002-x11rb.md).
x11rb = { version = "0.14", default-features = false }
# Ya transitiva de x11rb: apertura no bloqueante de la configuración, sin
# constantes de plataforma ni unsafe propio. No añade crates ni features.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
# Analizador TOML por eventos para el archivo de configuración (ADR 0014).
# Sin las features `unsafe`, `simd` ni `debug`: con `std` solo añade winnow.
toml_parser = { version = "1.1.5", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
